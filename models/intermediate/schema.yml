version: 2

models:
  - name: int_property_transactions
    description: "Enriched property transactions with business-friendly classifications."

    columns:
      - name: property_type_name
        description: "Business-friendly property type derived from the source property type code."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - detached
                  - flat_maisonette
                  - other
                  - semi_detached
                  - terraced